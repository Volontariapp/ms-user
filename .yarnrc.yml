nodeLinker: node-modules

packageExtensions:
  '@nestjs/common@*':
    peerDependenciesMeta:
      rxjs: { optional: true }
      reflect-metadata: { optional: true }
  '@nestjs/core@*':
    peerDependenciesMeta:
      rxjs: { optional: true }
      reflect-metadata: { optional: true }
  '@nestjs/axios@*':
    peerDependencies:
      '@nestjs/common': '*'
    peerDependenciesMeta:
      '@nestjs/common': { optional: true }
  '@nestjs/microservices@*':
    peerDependencies:
      '@nestjs/common': '*'
      '@nestjs/core': '*'
    peerDependenciesMeta:
      '@nestjs/common': { optional: true }
      '@nestjs/core': { optional: true }
  '@nestjs/swagger@*':
    peerDependencies:
      '@nestjs/common': '*'
      '@nestjs/core': '*'
    peerDependenciesMeta:
      '@nestjs/common': { optional: true }
      '@nestjs/core': { optional: true }
  '@nestjs/terminus@*':
    peerDependencies:
      '@nestjs/common': '*'
      '@nestjs/core': '*'
    peerDependenciesMeta:
      '@nestjs/common': { optional: true }
      '@nestjs/core': { optional: true }
  '@nestjs/typeorm@*':
    peerDependencies:
      '@nestjs/common': '*'
      '@nestjs/core': '*'
      'reflect-metadata': '*'
    peerDependenciesMeta:
      '@nestjs/common': { optional: true }
      '@nestjs/core': { optional: true }
      'reflect-metadata': { optional: true }
  '@volontariapp/auth@*':
    peerDependencies:
      '@nestjs/common': '*'
      '@nestjs/core': '*'
    peerDependenciesMeta:
      '@nestjs/common': { optional: true }
      '@nestjs/core': { optional: true }
  '@volontariapp/bridge-nest@*':
    peerDependencies:
      '@nestjs/common': '*'
    peerDependenciesMeta:
      '@nestjs/common': { optional: true }
  '@volontariapp/contracts-nest@*':
    peerDependencies:
      '@nestjs/common': '*'
    peerDependenciesMeta:
      '@nestjs/common': { optional: true }
  '@volontariapp/errors-nest@*':
    peerDependencies:
      '@nestjs/common': '*'
      '@nestjs/core': '*'
    peerDependenciesMeta:
      '@nestjs/common': { optional: true }
      '@nestjs/core': { optional: true }
  '@volontariapp/health-check-nest@*':
    peerDependencies:
      '@nestjs/common': '*'
      '@nestjs/terminus': '*'
    peerDependenciesMeta:
      '@nestjs/common': { optional: true }
      '@nestjs/terminus': { optional: true }
  '@volontariapp/validation-nest@*':
    peerDependencies:
      '@nestjs/common': '*'
      'class-validator': '*'
      'class-transformer': '*'
    peerDependenciesMeta:
      '@nestjs/common': { optional: true }
      'class-validator': { optional: true }
      'class-transformer': { optional: true }

  "@nestjs/axios@*":
    peerDependencies:
      "@nestjs/common": "*"
      "rxjs": "*"
      "reflect-metadata": "*"
    peerDependenciesMeta:
      "@nestjs/common": { "optional": true }
      "rxjs": { "optional": true }
      "reflect-metadata": { "optional": true }

  "@nestjs/microservices@*":
    peerDependencies:
      "@nestjs/core": "*"
      "rxjs": "*"
      "reflect-metadata": "*"
    peerDependenciesMeta:
      "@nestjs/core": { "optional": true }
      "rxjs": { "optional": true }
      "reflect-metadata": { "optional": true }

  "@nestjs/common@*":
    peerDependencies:
      "rxjs": "*"
      "reflect-metadata": "*"
    peerDependenciesMeta:
      "rxjs": { "optional": true }
      "reflect-metadata": { "optional": true }

  "@nestjs/core@*":
    peerDependencies:
      "rxjs": "*"
      "reflect-metadata": "*"
    peerDependenciesMeta:
      "rxjs": { "optional": true }
      "reflect-metadata": { "optional": true }
